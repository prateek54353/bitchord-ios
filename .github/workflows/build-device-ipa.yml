name: Build Unsigned Device IPA

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Clean build folder
      run: |
        rm -rf build
        xcodebuild clean -project BitChord.xcodeproj -scheme BitChord

    - name: Build for iOS Device (Universal Binary)
      run: |
        xcodebuild build \
          -project BitChord.xcodeproj \
          -scheme BitChord \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO \
          ARCHS="arm64 x86_64"

    - name: Archive for iOS Device
      run: |
        xcodebuild archive \
          -project BitChord.xcodeproj \
          -scheme BitChord \
          -archivePath build/BitChord-Device.xcarchive \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO \
          ARCHS="arm64 x86_64"

    - name: Create Export Options for Unsigned IPA
      run: |
        cat > ExportOptions.plist <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>enterprise</string>
            <key>compileBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <false/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
        </dict>
        </plist>
        EOF

    - name: Export Unsigned IPA
      run: |
        xcodebuild -exportArchive \
          -archivePath build/BitChord-Device.xcarchive \
          -exportPath build/export-device \
          -exportOptionsPlist ExportOptions.plist \
          -allowProvisioningUpdates || true

    - name: Create IPA from Archive
      run: |
        # Create IPA manually from archive with proper structure
        echo "Extracting app from archive..."
        cd build/BitChord-Device.xcarchive/Products/Applications
        if [ -d "BitChord.app" ]; then
          cd ../../../..
          mkdir -p build/Payload
          cp -R build/BitChord-Device.xcarchive/Products/Applications/BitChord.app build/Payload/
          cd build
          zip -r BitChord-device-unsigned.ipa Payload
          echo "IPA created with proper Payload structure"
        else
          echo "BitChord.app not found in archive"
          exit 1
        fi

    - name: Upload Device IPA
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: BitChord-device-unsigned-ipa
        path: build/BitChord-device-unsigned.ipa
        retention-days: 30

    - name: Upload Archive
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: BitChord-xcarchive
        path: build/BitChord-Device.xcarchive
        retention-days: 7

    - name: Upload Build Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: device-build-logs
        path: |
          build/
        retention-days: 7
