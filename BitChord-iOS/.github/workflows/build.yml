name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Resolve Swift Package Manager dependencies
      run: |
        cd BitChord
        swift package resolve

    - name: Build for iOS Simulator
      run: |
        cd BitChord
        xcodebuild -project BitChord.xcodeproj \
          -scheme BitChord \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
          clean build

    - name: Run unit tests
      run: |
        cd BitChord
        xcodebuild test -project BitChord.xcodeproj \
          -scheme BitChord \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
          -enableCodeCoverage YES

    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: |
          BitChord/build/Build/Products/Debug-iphonesimulator/BitChord.app
        retention-days: 7

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          BitChord/build/Build/Products/Debug-iphonesimulator/*.xcresult
        retention-days: 7
